# TEMPLATE ONLY. Adapt on the default branch after the activation checklist.
name: X12 plan to PR

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Approved feature branch in this repository
        type: string
        required: true
      source_sha:
        description: Full commit SHA approved at C2
        type: string
        required: true
      plan:
        description: Repository-relative plan.json path
        type: string
        required: true
      c2_approved:
        description: C2 was approved for this exact source SHA
        type: boolean
        default: false
      publish:
        description: Run ship and open the PR (off ends after all gates, nothing pushed)
        type: boolean
        default: false

permissions:
  contents: read

# One job per branch at a time; a repeat dispatch after a PR exists stops at run.py's existing-PR check.
concurrency:
  group: x12-${{ github.repository }}-${{ inputs.branch }}
  cancel-in-progress: false

jobs:
  inner-loop:
    # Configure this variable and runner label before copying the template.
    if: github.repository == vars.X12_REPOSITORY && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: [self-hosted, linux, x64, x12]
    timeout-minutes: 150
    env:
      X12_BRANCH: ${{ inputs.branch }}
      X12_SHA: ${{ inputs.source_sha }}
      X12_PLAN: ${{ inputs.plan }}
      X12_PUBLISH: ${{ inputs.publish }}
      X12_JOB: ${{ github.run_id }}-${{ github.run_attempt }}
      X12_HOST: /var/lib/x12/host-jobs/${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Require C2 approval for this SHA
        if: ${{ !inputs.c2_approved }}
        run: echo "C2 not approved for this source SHA" >&2 && exit 1

      # The controller comes from the default branch, never from the workload the agent edits.
      - name: Read the trusted controller from the default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: x12-control
          persist-credentials: false

      - name: Validate data before checkout or shell use
        shell: bash
        run: |
          set -euo pipefail
          git check-ref-format --branch "$X12_BRANCH"
          [[ "$X12_SHA" =~ ^[0-9a-f]{40}$ ]]

      - name: Check out the approved source into a fresh retained workspace
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          path: x12-work-${{ github.run_id }}-${{ github.run_attempt }}
          fetch-depth: 0
          persist-credentials: false

      - name: Create the named local branch and the container
        shell: bash
        env:
          X12_GIT_NAME: ${{ vars.X12_GIT_NAME }}
          X12_GIT_EMAIL: ${{ vars.X12_GIT_EMAIL }}
        run: |
          set -euo pipefail
          x12_work="$GITHUB_WORKSPACE/x12-work-$X12_JOB"
          git -C "$x12_work" switch -c "$X12_BRANCH"
          git -C "$x12_work" config user.name "${X12_GIT_NAME:?Set X12_GIT_NAME}"
          git -C "$x12_work" config user.email "${X12_GIT_EMAIL:?Set X12_GIT_EMAIL}"
          git -C "$x12_work" config credential.https://github.com.helper '!gh auth git-credential'
          mkdir -p "$X12_HOST"
          # Control, plugin and config are mounted read-only, so the agent cannot edit its own controller.
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ['GITHUB_WORKSPACE'])
          config = json.loads((root / 'x12-control/.devcontainer/devcontainer.json').read_text())
          mounts = [
              (str(root / 'x12-control'), '/opt/x12-control', ',readonly'),
              ('/opt/x12/andthen/plugin', '/opt/andthen', ',readonly'),
              ('/etc/x12', '/opt/x12-config', ',readonly'),
              ('/var/lib/x12/state', '/x12-state', ''),
          ]
          for source, target, mode in mounts:
              config.setdefault('runArgs', []).extend(['--mount', f'type=bind,source={source},target={target}{mode}'])
          Path(os.environ['X12_HOST'], 'devcontainer.override.json').write_text(json.dumps(config, indent=2))
          PY
          devcontainer up --workspace-folder "$x12_work" \
            --override-config "$X12_HOST/devcontainer.override.json" > "$X12_HOST/container.json"

      - name: Verify the read-only mounts before providing credentials
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          info = json.loads(Path(os.environ['X12_HOST'], 'container.json').read_text())
          if info.get('outcome') != 'success':
              raise SystemExit('Container startup failed')
          actual = json.loads(subprocess.check_output(['docker', 'inspect', info['containerId']], text=True))[0]
          if actual['HostConfig']['Privileged']:
              raise SystemExit('Privileged container is outside the X12 boundary')
          guarded = {'/opt/x12-control', '/opt/andthen', '/opt/x12-config'}
          mounted = {m['Destination']: m['RW'] for m in actual['Mounts']}
          if not guarded <= set(mounted) or any(mounted[d] for d in guarded):
              raise SystemExit('Controller, plugin and configuration must be mounted read-only')
          PY

      - name: Run the inner loop
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.X12_GITHUB_TOKEN }}
          # Your own subscription token from `claude setup-token`, stored as a secret of your own repo. Never also
          # set ANTHROPIC_API_KEY here: in -p mode an API key wins over this token.
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.X12_CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          set -euo pipefail
          field() { python3 -c 'import json, sys; print(json.load(open(sys.argv[1]))[sys.argv[2]])' "$X12_HOST/container.json" "$1"; }
          x12_args=(--config /opt/x12-config/config.json --branch "$X12_BRANCH" --sha "$X12_SHA" --plan "$X12_PLAN" --c2-approved)
          if [[ "$X12_PUBLISH" == true ]]; then x12_args+=(--publish); fi
          # Docker reads the secrets from this step's environment; none is a literal argument.
          docker exec --user "$(field remoteUser)" --workdir "$(field remoteWorkspaceFolder)" \
            --env GH_TOKEN --env CLAUDE_CODE_OAUTH_TOKEN --env GITHUB_SERVER_URL --env GITHUB_REPOSITORY --env GITHUB_RUN_ID --env X12_JOB \
            "$(field containerId)" python3 /opt/x12-control/labs/x12-plan-to-pr/run.py "${x12_args[@]}"

      # A foreground `docker exec` neither runs bash traps nor forwards signals, so a cancelled job is stopped here.
      - name: Stop only this job's retained container
        if: always()
        shell: bash
        run: |
          if [[ -f "$X12_HOST/container.json" ]]; then
            docker stop --time 10 "$(python3 -c 'import json, sys; print(json.load(open(sys.argv[1]))["containerId"])' "$X12_HOST/container.json")" || true
          fi

      - name: Upload the run record and reports even when a gate fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: x12-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            /var/lib/x12/state/${{ github.run_id }}-${{ github.run_attempt }}/status.json
            /var/lib/x12/state/${{ github.run_id }}-${{ github.run_attempt }}/**/*.md
            /var/lib/x12/state/${{ github.run_id }}-${{ github.run_attempt }}/final-check-*
            /var/lib/x12/state/${{ github.run_id }}-${{ github.run_attempt }}/post-ship-check-*
          retention-days: 7
          if-no-files-found: warn

      # Workload, stopped container, Claude volume and state are deliberately retained.
      # The operator archives owned work, then removes only this job's resources.

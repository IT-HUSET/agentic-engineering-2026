# TEMPLATE ONLY. Adapt on the default branch after the live activation checklist.
name: X12 plan to PR

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Approved feature branch in this repository
        type: string
        required: true
      source_sha:
        description: Full commit SHA approved at C2
        type: string
        required: true
      plan:
        description: Repository-relative plan.json path
        type: string
        required: true
      c2_approved:
        description: C2 was approved for this exact source SHA
        type: boolean
        default: false
      publish:
        description: Invoke ship after all gates (also needs host config activation)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: x12-${{ github.repository }}-${{ inputs.branch }}
  cancel-in-progress: false

jobs:
  inner-loop:
    # Configure this variable and runner label before copying the template.
    if: github.repository == vars.X12_REPOSITORY && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && inputs.c2_approved
    runs-on: [self-hosted, linux, x64, x12]
    timeout-minutes: 150
    env:
      X12_BRANCH: ${{ inputs.branch }}
      X12_SHA: ${{ inputs.source_sha }}
      X12_PLAN: ${{ inputs.plan }}
      X12_PUBLISH: ${{ inputs.publish }}
      X12_JOB: ${{ github.run_id }}-${{ github.run_attempt }}
      X12_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - name: Read the trusted controller from the default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: x12-control
          persist-credentials: false

      - name: Validate data before checkout or shell use
        shell: bash
        run: |
          set -euo pipefail
          git check-ref-format --branch "$X12_BRANCH"
          [[ "$X12_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$X12_BRANCH" != "$X12_DEFAULT_BRANCH" ]]

      - name: Check out the approved source into a fresh retained workspace
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          path: x12-work-${{ github.run_id }}-${{ github.run_attempt }}
          fetch-depth: 0
          persist-credentials: false

      - name: Create the named local branch and container override
        shell: bash
        env:
          X12_GIT_NAME: ${{ vars.X12_GIT_NAME }}
          X12_GIT_EMAIL: ${{ vars.X12_GIT_EMAIL }}
        run: |
          set -euo pipefail
          x12_work="$GITHUB_WORKSPACE/x12-work-$X12_JOB"
          git -C "$x12_work" switch -c "$X12_BRANCH"
          git -C "$x12_work" config user.name "${X12_GIT_NAME:?Set X12_GIT_NAME}"
          git -C "$x12_work" config user.email "${X12_GIT_EMAIL:?Set X12_GIT_EMAIL}"
          git -C "$x12_work" config credential.https://github.com.helper '!gh auth git-credential'
          mkdir -p "/var/lib/x12/host-jobs/$X12_JOB"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ['GITHUB_WORKSPACE'])
          job = os.environ['X12_JOB']
          config = json.loads((root / 'x12-control/.devcontainer/devcontainer.json').read_text())
          mounts = [
              (str(root / 'x12-control'), '/opt/x12-control', True),
              ('/opt/x12/andthen/plugin', '/opt/andthen', True),
              ('/etc/x12', '/opt/x12-config', True),
              ('/var/lib/x12/state', '/x12-state', False),
          ]
          args = config.setdefault('runArgs', [])
          for source, target, readonly in mounts:
              if ',' in source:
                  raise SystemExit('Comma in bind-mount source is unsupported')
              args.extend(['--mount', f'type=bind,source={source},target={target}' + (',readonly' if readonly else '')])
          # Override contents, while preserving the workload config's path for relative Dockerfile resolution.
          Path('/var/lib/x12/host-jobs', job, 'devcontainer.override.json').write_text(json.dumps(config, indent=2))
          PY
          devcontainer up --workspace-folder "$x12_work" \
            --override-config "/var/lib/x12/host-jobs/$X12_JOB/devcontainer.override.json" \
            > "/var/lib/x12/host-jobs/$X12_JOB/container.json"

      - name: Verify the actual mounts before providing credentials
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          host = Path('/var/lib/x12/host-jobs', os.environ['X12_JOB'])
          info = json.loads((host / 'container.json').read_text())
          if info.get('outcome') != 'success':
              raise SystemExit('Container startup failed')
          actual = json.loads(subprocess.check_output(['docker', 'inspect', info['containerId']], text=True))[0]
          if actual['HostConfig']['Privileged']:
              raise SystemExit('Privileged container is outside the X12 boundary')
          allowed = {
              str(Path(os.environ['GITHUB_WORKSPACE']) / ('x12-work-' + os.environ['X12_JOB'])),
              str(Path(os.environ['GITHUB_WORKSPACE']) / 'x12-control'),
              '/opt/x12/andthen/plugin', '/etc/x12', '/var/lib/x12/state',
          }
          for mount in actual['Mounts']:
              if mount['Type'] == 'bind' and mount['Source'] not in allowed:
                  raise SystemExit('Unexpected bind mount: ' + mount['Source'])
              if mount['Destination'] in ('/opt/x12-control', '/opt/andthen', '/opt/x12-config') and mount['RW']:
                  raise SystemExit('Controller, plugin and configuration mounts must be read-only')
          (host / 'inspect.json').write_text(json.dumps(actual, indent=2))
          PY

      - name: Run the bounded inner loop
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.X12_GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.X12_ANTHROPIC_API_KEY }}
        run: |
          set -euo pipefail
          mapfile -t x12_container < <(python3 - <<'PY'
          import json, os
          from pathlib import Path
          value = json.loads(Path('/var/lib/x12/host-jobs', os.environ['X12_JOB'], 'container.json').read_text())
          print(value['containerId'])
          print(value['remoteUser'])
          print(value['remoteWorkspaceFolder'])
          PY
          )
          x12_stop() { docker stop --time 10 "${x12_container[0]}" >/dev/null 2>&1 || true; }
          trap x12_stop EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM
          x12_args=(--config /opt/x12-config/config.json --branch "$X12_BRANCH" --sha "$X12_SHA" --plan "$X12_PLAN" --base main --c2-approved)
          if [[ "$X12_PUBLISH" == true ]]; then x12_args+=(--publish); fi
          # Docker reads these values from this step's environment; no token is a literal argument.
          docker exec --user "${x12_container[1]}" --workdir "${x12_container[2]}" \
            --env GH_TOKEN --env ANTHROPIC_API_KEY --env GITHUB_SERVER_URL --env GITHUB_REPOSITORY --env GITHUB_RUN_ID --env X12_JOB \
            "${x12_container[0]}" python3 /opt/x12-control/labs/x12-plan-to-pr/run.py "${x12_args[@]}"

      - name: Stop only this job's retained container
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, re, subprocess
          from pathlib import Path
          path = Path('/var/lib/x12/host-jobs', os.environ['X12_JOB'], 'container.json')
          if path.is_file():
              container = json.loads(path.read_text()).get('containerId', '')
              if re.fullmatch('[0-9a-f]{64}', container):
                  subprocess.run(['docker', 'stop', '--time', '10', container], check=False, timeout=20)
          PY

      - name: Collect only this job's retained evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, shutil
          from pathlib import Path
          host = Path('/var/lib/x12/host-jobs', os.environ['X12_JOB'])
          if not (host / 'container.json').is_file():
              raise SystemExit(0)
          info = json.loads((host / 'container.json').read_text())
          for status in Path('/var/lib/x12/state/runs').glob('*/status.json'):
              value = json.loads(status.read_text())
              if value.get('job_id') == os.environ['X12_JOB']:
                  for source in status.parent.rglob('*'):
                      selected = source.name == 'status.json' or source.suffix == '.md' or source.name.startswith(('final-check-', 'post-ship-check-'))
                      if source.is_file() and not source.is_symlink() and selected:
                          target = host / 'evidence' / source.relative_to(status.parent)
                          target.parent.mkdir(parents=True, exist_ok=True)
                          shutil.copy2(source, target)
          PY

      - name: Upload evidence even when a gate fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: x12-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            /var/lib/x12/host-jobs/${{ github.run_id }}-${{ github.run_attempt }}/
          retention-days: 7
          if-no-files-found: warn

      # Workload, stopped container, Claude volume and state are deliberately retained.
      # The operator archives owned work, then removes only this job's resources.

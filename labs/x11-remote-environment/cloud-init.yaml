#cloud-config
package_update: true
packages:
  - ca-certificates
  - curl
  - gnupg
  - git
  - build-essential
  - python3
write_files:
  - path: /usr/local/sbin/x11-host-setup
    permissions: '0755'
    content: |
      #!/usr/bin/env bash
      set -euo pipefail
      install -m 0755 -d /etc/apt/keyrings
      curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
      chmod a+r /etc/apt/keyrings/docker.asc
      cat > /etc/apt/sources.list.d/docker.sources <<SOURCES
      Types: deb
      URIs: https://download.docker.com/linux/ubuntu
      Suites: noble
      Components: stable
      Architectures: amd64
      Signed-By: /etc/apt/keyrings/docker.asc
      SOURCES
      curl -fsSL https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key | gpg --dearmor --yes -o /etc/apt/keyrings/nodesource.gpg
      echo 'deb [arch=amd64 signed-by=/etc/apt/keyrings/nodesource.gpg] https://deb.nodesource.com/node_24.x nodistro main' > /etc/apt/sources.list.d/nodesource.list
      apt-get update
      DEBIAN_FRONTEND=noninteractive apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin nodejs
      npm install -g @devcontainers/cli@0.90.0
      systemctl enable --now docker
      printf 'Harmless host-only marker. Do not mount /opt in the agent container.\n' > /opt/x11-host-only.txt
runcmd:
  - ['/usr/local/sbin/x11-host-setup']
